name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-history-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-$GITLEAKS_VERSION"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
          "$install_dir/gitleaks" version | grep --fixed-strings "$GITLEAKS_VERSION"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Scan complete Git history for hardcoded secrets with redacted findings
        run: >-
          gitleaks git
          --redact=100
          --log-opts=--all
          --report-format=sarif
          --report-path=results.sarif
          --exit-code=1
          --no-banner
          --log-level=info
          .
      - name: Upload redacted secret-scan evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-history-scan-${{ github.sha }}
          path: results.sarif
          if-no-files-found: error
          retention-days: 30

  core-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/core-api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Require NVD API key for fail-closed Java SCA
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: test -n "$NVD_API_KEY"
      - name: Generate production SBOM and reject known vulnerabilities
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests -Psupply-chain-audit verify
      - name: Upload Java SBOM and vulnerability evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-api-supply-chain-${{ github.sha }}
          path: |
            apps/core-api/target/supply-chain/sbom.json
            apps/core-api/target/supply-chain/sbom.xml
            apps/core-api/target/supply-chain/dependency-check/
          if-no-files-found: error
          retention-days: 30

  automation-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/automation-service
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/automation-service/requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pytest -q
      - run: mkdir -p "$GITHUB_WORKSPACE/supply-chain"
      - name: Generate Python CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Trivy v0.70.0
        with:
          scan-type: fs
          scan-ref: apps/automation-service
          format: cyclonedx
          output: supply-chain/automation-service.cdx.json
          exit-code: "0"
          list-all-pkgs: "true"
          version: v0.70.0
      - name: Audit Python dependencies and retain machine-readable findings
        run: >-
          pip-audit -r requirements.lock --no-deps --disable-pip --strict
          --format=json
          --output "$GITHUB_WORKSPACE/supply-chain/automation-service.pip-audit.json"
      - name: Upload Python supply-chain evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-service-supply-chain-${{ github.sha }}
          path: |
            supply-chain/automation-service.cdx.json
            supply-chain/automation-service.pip-audit.json
          if-no-files-found: error
          retention-days: 30

  crawler-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/crawler-service
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: apps/crawler-service/package-lock.json
      - run: test "$(node --version)" = "v24.18.0" && test "$(npm --version)" = "11.16.0"
      - run: npm ci --no-audit --no-fund --strict-allow-scripts
      - run: npm test
      - run: npm run build
      - run: mkdir -p "$GITHUB_WORKSPACE/supply-chain"
      - name: Generate crawler CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Trivy v0.70.0
        with:
          scan-type: fs
          scan-ref: apps/crawler-service
          format: cyclonedx
          output: supply-chain/crawler-service.cdx.json
          exit-code: "0"
          list-all-pkgs: "true"
          version: v0.70.0
      - name: Audit crawler dependencies and retain machine-readable findings
        run: >-
          npm audit --audit-level=low --json
          --registry=https://registry.npmjs.org
          > "$GITHUB_WORKSPACE/supply-chain/crawler-service.npm-audit.json"
      - name: Upload crawler supply-chain evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crawler-service-supply-chain-${{ github.sha }}
          path: |
            supply-chain/crawler-service.cdx.json
            supply-chain/crawler-service.npm-audit.json
          if-no-files-found: error
          retention-days: 30

  user-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/user-web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: apps/user-web/package-lock.json
      - run: test "$(node --version)" = "v24.18.0" && test "$(npm --version)" = "11.16.0"
      - run: npm ci --no-audit --no-fund --strict-allow-scripts
      - run: npm run check
      - run: mkdir -p "$GITHUB_WORKSPACE/supply-chain"
      - name: Generate user web CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Trivy v0.70.0
        with:
          scan-type: fs
          scan-ref: apps/user-web
          format: cyclonedx
          output: supply-chain/user-web.cdx.json
          exit-code: "0"
          list-all-pkgs: "true"
          version: v0.70.0
      - name: Audit user web dependencies and retain machine-readable findings
        run: >-
          npm audit --audit-level=low --json
          --registry=https://registry.npmjs.org
          > "$GITHUB_WORKSPACE/supply-chain/user-web.npm-audit.json"
      - name: Upload user web supply-chain evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: user-web-supply-chain-${{ github.sha }}
          path: |
            supply-chain/user-web.cdx.json
            supply-chain/user-web.npm-audit.json
          if-no-files-found: error
          retention-days: 30

  admin-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: test "$(node --version)" = "v24.18.0" && test "$(npm --version)" = "11.16.0"
      - run: npm ci --no-audit --no-fund --strict-allow-scripts
      - run: npm run check
      - run: mkdir -p "$GITHUB_WORKSPACE/supply-chain"
      - name: Generate admin web CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Trivy v0.70.0
        with:
          scan-type: fs
          scan-ref: apps/admin-web
          format: cyclonedx
          output: supply-chain/admin-web.cdx.json
          exit-code: "0"
          list-all-pkgs: "true"
          version: v0.70.0
      - name: Audit admin web dependencies and retain machine-readable findings
        run: >-
          npm audit --audit-level=low --json
          --registry=https://registry.npmjs.org
          > "$GITHUB_WORKSPACE/supply-chain/admin-web.npm-audit.json"
      - name: Upload admin web supply-chain evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-web-supply-chain-${{ github.sha }}
          path: |
            supply-chain/admin-web.cdx.json
            supply-chain/admin-web.npm-audit.json
          if-no-files-found: error
          retention-days: 30

  release-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.lock
      - run: python -m pip install --require-hashes -r scripts/requirements-ci.lock
      - run: python scripts/validate_migrations.py
      - run: python -m pytest -q scripts/tests

  monitoring-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate Prometheus configuration and alert rules
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount type=bind,src="$PWD/monitoring/prometheus",dst=/etc/prometheus,readonly \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.5.3 \
            check config /etc/prometheus/prometheus.yml
      - name: Validate Alertmanager routing and receiver configuration
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/alertmanager-webhook-url"
          printf '%s\n' 'https://incident-receiver.invalid/xianyupilot' > "$secret_file"
          chmod 0644 "$secret_file"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount type=bind,src="$PWD/monitoring/alertmanager",dst=/etc/alertmanager,readonly \
            --mount type=bind,src="$secret_file",dst=/run/secrets/alertmanager_webhook_url,readonly \
            --entrypoint /bin/amtool \
            prom/alertmanager:v0.32.1 \
            check-config /etc/alertmanager/alertmanager.yml

  container-supply-chain:
    needs:
      - core-api
      - automation-service
      - crawler-service
      - user-web
      - admin-web
      - release-contracts
      - secret-history-scan
      - monitoring-config
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - id: core-api
            kind: build
            context: ./apps/core-api
          - id: automation-service
            kind: build
            context: ./apps/automation-service
          - id: crawler-service
            kind: build
            context: ./apps/crawler-service
          - id: admin-web
            kind: build
            context: ./apps/admin-web
          - id: user-web
            kind: build
            context: ./apps/user-web
          - id: mysql
            kind: pull
            image: mysql:8.4.10
          - id: redis
            kind: pull
            image: redis:7.4.9-alpine
          - id: crawler-postgres
            kind: pull
            image: postgres:16.14-alpine
          - id: blackbox-exporter
            kind: pull
            image: quay.io/prometheus/blackbox-exporter:v0.28.0
          - id: alertmanager
            kind: pull
            image: prom/alertmanager:v0.32.1
          - id: prometheus
            kind: pull
            image: prom/prometheus:v3.5.3
          - id: grafana
            kind: pull
            image: grafana/grafana:12.4.5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build or resolve exact production image subject
        shell: bash
        env:
          SUBJECT_ID: ${{ matrix.id }}
          SUBJECT_KIND: ${{ matrix.kind }}
          SUBJECT_CONTEXT: ${{ matrix.context }}
          SUBJECT_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          mkdir -p supply-chain

          if [[ "$SUBJECT_KIND" == "build" ]]; then
            requested_reference="$SUBJECT_CONTEXT"
            image_ref="local/$SUBJECT_ID:$GITHUB_SHA"
            docker build --pull --tag "$image_ref" "$SUBJECT_CONTEXT"
          elif [[ "$SUBJECT_KIND" == "pull" ]]; then
            requested_reference="$SUBJECT_IMAGE"
            docker pull "$SUBJECT_IMAGE"
            image_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$SUBJECT_IMAGE")"
            [[ "$image_ref" == *@sha256:* ]]
          else
            echo "Unsupported image subject kind" >&2
            exit 1
          fi

          image_id="$(docker image inspect --format '{{.Id}}' "$image_ref")"
          [[ "$image_id" == sha256:* ]]
          echo "IMAGE_REF=$image_ref" >> "$GITHUB_ENV"

          {
            printf '{\n'
            printf '  "releaseRevision": "%s",\n' "$GITHUB_SHA"
            printf '  "requestedReference": "%s",\n' "$requested_reference"
            printf '  "scannedReference": "%s",\n' "$image_ref"
            printf '  "imageId": "%s"\n' "$image_id"
            printf '}\n'
          } > "supply-chain/$SUBJECT_ID.subject.json"
      - name: Generate image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Trivy v0.70.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          format: cyclonedx
          output: supply-chain/${{ matrix.id }}.cdx.json
          exit-code: "0"
          list-all-pkgs: "true"
          timeout: 20m
          version: v0.70.0
      - name: Scan image and reject every high or critical vulnerability
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Trivy v0.70.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          format: json
          output: supply-chain/${{ matrix.id }}.vulnerabilities.json
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "1"
          timeout: 20m
          version: v0.70.0
          skip-setup-trivy: "true"
      - name: Upload image SBOM, subject, and vulnerability evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-supply-chain-${{ matrix.id }}-${{ github.sha }}
          path: |
            supply-chain/*.subject.json
            supply-chain/*.cdx.json
            supply-chain/*.vulnerabilities.json
          if-no-files-found: error
          retention-days: 30

  release-provenance-gate:
    needs:
      - container-supply-chain
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Block commercial tag release without verifiable image provenance
        run: |
          echo "::error::registry-backed image signing and provenance are not configured"
          echo "Configure an immutable production registry, least-privilege push credentials, GitHub OIDC, keyless signatures, and in-toto/SLSA attestations; then replace this blocker with digest-bound cosign verification."
          exit 1
