# Replace every legacy /uploads proxy block on the Hong Kong Nginx with this
# location (one per www/admin server block). Media then loads straight from
# api.xianyupilot.com (Shenzhen backend) instead of crossing the lossy
# Hong Kong <-> Shenzhen link.
    location ^~ /uploads/ {
        return 308 https://api.xianyupilot.com$request_uri;
    }
