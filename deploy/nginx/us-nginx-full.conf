# SECURITY REQUIREMENT: backend traffic is sent only to the loopback endpoint of
# the pinned-host-key SSH tunnel defined in
# deploy/systemd/xianyupilot-origin-tunnel.service.template. The deployment
# entrypoint refuses frontend cutover unless that unit is active and the backend
# health response is available through 127.0.0.1:18081. Never replace this with
# a public plaintext HTTP origin; verified HTTPS/mTLS is also supported.
# Managed by scripts/prod_deploy.py.
# Keep this file in sync with the US frontend topology used by ports 81 and 82.

server_tokens off;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Only the same-host TLS terminator may reach the application vhosts as
# decrypted HTTP. Direct public port-80 traffic is redirected, except ACME.
geo $from_local_tls_terminator {
    default 0;
    127.0.0.1 1;
    ::1 1;
}
map "$from_local_tls_terminator:$uri" $redirect_public_plaintext {
    default 1;
    ~^1: 0;
    ~^0:/\.well-known/acme-challenge/ 0;
}

# Port 80: Subscription + VMess WS proxy
server {
    listen 80;
    server_name _;

    location /vmess {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    location /clash.yaml {
        alias /var/www/sub/clash.yaml;
        default_type text/yaml;
        add_header Cache-Control no-cache;
    }

    location /sub {
        alias /var/www/sub/v2rayn.txt;
        default_type text/plain;
        add_header Cache-Control no-cache;
    }

    root /var/www/sub;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Port 80: XianYuPilot user frontend. TLS is terminated by the HTTPS
# multiplexer on port 443 after the certificate has been issued.
server {
    listen 80;
    server_name www.xianyupilot.com;
    root /var/www/user-web;
    index index.html;
    client_max_body_size 50m;

    if ($redirect_public_plaintext = 1) {
        return 308 https://$host$request_uri;
    }

    # Vite names /assets files by content hash, so they are safe to cache at the
    # browser and Cloudflare edge for a long time. Keep index.html revalidating
    # so a new release immediately points clients at the new asset names.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Product illustrations are not content-hashed, so use a shorter cache
    # lifetime while still allowing Cloudflare to serve them at the edge.
    location ^~ /xya/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:18081/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /api/sse/subscribe {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_socket_keepalive on;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /ai/ {
        proxy_pass http://127.0.0.1:18081/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    location /bot/ {
        proxy_pass http://127.0.0.1:18081/bot/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }
}

