# api.example.com: browser -> HK TLS -> Cloudflare Tunnel relay -> Shenzhen backend
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    # backend.example.com 解析为 Cloudflare 任播地址时可能优先返回 AAAA，
    # 但本机无 IPv6 路由，强制只用 IPv4 解析，避免每次请求先等 IPv6 超时。
    resolver 1.1.1.1 valid=300s ipv6=off;
    set $relay_backend backend.example.com;

    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ ^/(api|admin-api)/sse/ {
        proxy_pass https://backend.example.com;
        proxy_http_version 1.1;
