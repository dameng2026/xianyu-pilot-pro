        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_socket_keepalive on;
        add_header X-Accel-Buffering no;
    }

    # 兜底路径：WireGuard/公网 upstream 全部失败(502/503/504)时，
    # 回退到 Cloudflare Tunnel relay(backend.example.com)。
    location @api_cf_relay {
        proxy_pass https://backend.example.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host backend.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_ssl_server_name on;
        proxy_ssl_name backend.example.com;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://xianyu_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_cf_relay;
        # 连接超时 10s：WG 隧道静默断开时快速切到 backup/CF relay，避免前端 30s 超时
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 易支付异步回调入口：POST/GET /open-api/payment/callback/{channel}
    # 必须转发到后端，否则会被 SPA fallback 拦截返回前端首页，回调永远无法到达后端
    location /open-api/ {
        proxy_pass http://xianyu_backend/open-api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /ai/ {
        proxy_pass http://xianyu_backend/ai/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /bot/ {
        proxy_pass http://xianyu_backend/bot/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
}

# Port 82: admin-web
server {
    listen 127.0.0.1:82;
    server_name _;
    root /var/www/admin-web;

    resolver 1.1.1.1 valid=300s ipv6=off;
    set $relay_backend backend.example.com;
    index index.html;
    client_max_body_size 50m;

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backward-compat: legacy flat carousel URLs (uploaded by old code without a
    # tenant subdirectory) are rewritten to tenant-1/ so MediaAssetController's
    # tenant-scoped regex can match.  This prefix is longer than ^~ /uploads/
    # below, so Nginx matches it first for flat carousel paths only.
    location ^~ /uploads/ {
        alias /var/www/uploads-data/;
        if ($cookie_xianyu_media_admin = "") { return 403; }
        error_page 404 = @uploads_relay;
    }

    location @uploads_relay {
        proxy_pass https://backend.example.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host backend.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_ssl_server_name on;
        proxy_ssl_name backend.example.com;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }


    location @admin_api_cf_relay {
        proxy_pass https://backend.example.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host backend.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_ssl_server_name on;
        proxy_ssl_name backend.example.com;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /admin-api/ {
        proxy_pass http://xianyu_backend/admin-api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_request_buffering on;
        proxy_intercept_errors on;
        error_page 502 503 504 = @admin_api_cf_relay;
        proxy_connect_timeout 10s;
    }
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
}
