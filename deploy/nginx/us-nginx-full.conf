# Backend traffic is sent to the backend via the WireGuard private path
# (10.0.0.1:18080) as primary. WireGuard carries the traffic over UDP with 25s
# persistent keepalive. iptables on the backend restricts 18080 to
# 10.0.0.0/24 + the frontend server IP only.
# Fallback guidance: add another member over the same private network, or use
# a verified HTTPS origin (proxy_ssl_verify on) — a public plaintext HTTP
# backup server is rejected by the release preflight in scripts/prod_deploy.py.
# Managed by scripts/prod_deploy.py.
# Keep this file in sync with the frontend topology used by ports 81 and 82.

# 国内后端 upstream，启用 keepalive 复用 TCP 连接，减少跨境冷启动延迟
# 性能调优：keepalive 从 32 提到 128，应对高并发 API 请求；keepalive_requests 提到 5000
upstream xianyu_backend {
    server 10.0.0.1:18080;
    # Optional second member over the same private network:
    # server 10.0.0.2:18080 backup;
    keepalive 128;
    keepalive_requests 5000;
    keepalive_timeout 60s;
}

proxy_cache_path /var/cache/nginx/xya_api levels=1:2 keys_zone=xya_api:10m max_size=256m inactive=60m use_temp_path=off;

server_tokens off;
# 优先返回预压缩 .gz 文件（vite-plugin-compression 生成），零 CPU 开销
# 与 apps/user-web/nginx.conf 和 apps/admin-web/nginx.conf 保持一致
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;

# Brotli 压缩（比 gzip 再小 10-20%）。
# 启用前提：Nginx 已编译 ngx_brotli 模块（见 deploy/nginx/brotli.conf）。
# 当前默认未启用：服务器 Nginx 安装 brotli 模块后，取消下方 include 行的注释即可启用。
# 前端构建已生成 .br 预压缩文件（vite.config.js 中 brotliCompress 实例）。
# include /etc/nginx/brotli.conf;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://pay.example.com; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# TLS is terminated by Nginx itself on port 443 (Let's Encrypt certificate).
# Direct public port-80 traffic is redirected to HTTPS, except ACME challenge
# requests and loopback (same-host) traffic which are allowed in plaintext.
geo $from_local_tls_terminator {
    default 0;
    127.0.0.1 1;
    ::1 1;
}
map "$from_local_tls_terminator:$scheme:$uri" $redirect_public_plaintext {
    default 1;
    ~^1:http 0;
    ~^1:https 0;
    ~^0:https 0;
    ~^0:http:/\.well-known/acme-challenge/ 0;
}

# xianyu-pilot-pro user frontend. TLS is terminated by Nginx on port 443 using the
# Let's Encrypt certificate; plain HTTP on port 80 is redirected to HTTPS.
server {
    listen 80;
    listen 443 ssl;
    server_name www.example.com;

    resolver 1.1.1.1 valid=300s ipv6=off;
    set $relay_backend backend.example.com;

    location = /api/media/session {
        proxy_pass https://backend.example.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host backend.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_ssl_server_name on;
        proxy_ssl_name backend.example.com;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    root /var/www/user-web;
    index index.html;
    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/xianyupilot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xianyupilot/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    if ($redirect_public_plaintext = 1) {
        return 308 https://$host$request_uri;
    }

    # Vite names /assets files by content hash, so they are safe to cache at the
    # browser and Cloudflare edge for a long time. Keep index.html revalidating
    # so a new release immediately points clients at the new asset names.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Product illustrations are not content-hashed, so use a shorter cache
    # lifetime while still allowing Cloudflare to serve them at the edge.
    location ^~ /xya/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backward-compat: legacy flat carousel URLs (uploaded by old code without a
    # tenant subdirectory) are rewritten to tenant-1/ so MediaAssetController's
    # tenant-scoped regex can match.  This prefix is longer than ^~ /uploads/
    # below, so Nginx matches it first for flat carousel paths only.
    location ^~ /uploads/ {
        alias /var/www/uploads-data/;
        if ($cookie_xianyu_media_user = "") { return 403; }
        error_page 404 = @uploads_relay;
    }

    location @uploads_relay {
        proxy_pass https://backend.example.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host backend.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_ssl_server_name on;
        proxy_ssl_name backend.example.com;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }


    # 全局状态接口微缓存：避免每次轮询都穿透香港->深圳丢包链路
    location ~ ^/api/(maintenance/status|ai-provider/status)$ {
        proxy_pass http://xianyu_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_ignore_headers Cache-Control Expires Vary Set-Cookie;
        proxy_cache xya_api;
        proxy_cache_key "$scheme$host$uri$http_origin$http_accept_encoding";
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }
    location ~ ^/api/(opportunity/image-status|health)$ {
        proxy_pass http://xianyu_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_ignore_headers Cache-Control Expires Vary Set-Cookie;
        proxy_cache xya_api;
        proxy_cache_key "$scheme$host$uri$http_origin$http_accept_encoding";
        proxy_cache_valid 200 10s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /api/sse/subscribe {
        proxy_pass http://xianyu_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_socket_keepalive on;
        add_header X-Accel-Buffering no;
    }

    # 兜底路径：WireGuard/公网 upstream 全部失败(502/503/504)时，
    # 回退到 Cloudflare Tunnel relay(backend.example.com)，
    # 该路径从国内服务器出站连接 Cloudflare，不依赖香港<->国内直连公网。
    # 需 proxy_request_buffering on + 磁盘缓冲，POST 请求体才能回放到兜底 upstream。
    # 注意：命名 location 中 proxy_pass 不得带 URI（否则会拼接出 /api//api/... 双重路径），
    # 必须省略 URI 部分以原样传递请求 URI。
    location @api_cf_relay {
        proxy_pass https://backend.example.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host backend.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_ssl_server_name on;
        proxy_ssl_name backend.example.com;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://xianyu_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        # 开启请求体缓冲（大请求体落盘），保证 502/503/504 时能回放到 CF relay 兜底
        proxy_request_buffering on;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_cf_relay;
        # 连接超时 10s：WG 隧道静默断开时快速切到 backup/CF relay，避免前端 30s 超时
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 易支付异步回调入口：POST/GET /open-api/payment/callback/{channel}
    # 必须转发到后端，否则会被 SPA fallback 拦截返回前端首页，回调永远无法到达后端
    location /open-api/ {
        proxy_pass http://xianyu_backend/open-api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /ai/ {
        proxy_pass http://xianyu_backend/ai/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    location /bot/ {
        proxy_pass http://xianyu_backend/bot/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
}

