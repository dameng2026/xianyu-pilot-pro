# SECURITY BLOCKER: the current public plaintext HTTP origin is rejected by
# scripts/prod_deploy.py. Client-facing TLS and X-Forwarded-Proto do not encrypt
# the Hong Kong-to-China origin hop. Before production, use verified HTTPS with
# `proxy_ssl_verify on`, a trusted CA bundle, and preferably mTLS; alternatively
# route HTTP only over an operator-verified VPN/private address.
# Managed separately from nginx-full.conf because the certificate is provisioned on the Hong Kong host.
# HTTPS is received by HAProxy on public port 443 and forwarded to this loopback listener.

# Upstream pool with keepalive to reuse cross-public-Internet TCP connections
# from the TLS terminator to the backend (public origin example: 203.0.113.10:18080).
# Without keepalive every API request pays a fresh TCP + TLS handshake (~100-300ms).
# 性能调优：keepalive 从 32 提到 128，keepalive_requests 提到 5000
upstream backend_pool {
    server 203.0.113.10:18080;
    keepalive 128;
    keepalive_requests 5000;
    keepalive_timeout 60s;
}

# Enable gzip compression at the TLS termination layer so all HTTPS responses
# are compressed before crossing the public Internet to the browser.
# 优先返回预压缩 .gz 文件，零 CPU 开销
gzip_static on;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/wasm
    application/xml
    text/css
    text/plain
    text/xml
    image/svg+xml;

# Brotli 压缩（比 gzip 再小 10-20%）。
# 启用前提：Nginx 已编译 ngx_brotli 模块（见 deploy/nginx/brotli.conf）。
# 当前默认未启用：服务器 Nginx 安装 brotli 模块后，取消下方 include 行的注释即可启用。
# 前端构建已生成 .br 预压缩文件（vite.config.js 中 brotliCompress 实例）。
# include /etc/nginx/brotli.conf;

server {
    listen 127.0.0.1:8443 ssl http2;
    server_name www.example.com;
    root /var/www/user-web;
    index index.html;
    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/xianyupilot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xianyupilot/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # index.html must never be cached, otherwise users get stale JS references
    # after a deploy when /assets/ hashes change.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed assets under /assets; safe to cache immutably.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
        access_log off;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend_pool/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /api/sse/subscribe {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_socket_keepalive on;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://backend_pool/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /ai/ {
        proxy_pass http://backend_pool/ai/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /bot/ {
        proxy_pass http://backend_pool/bot/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

