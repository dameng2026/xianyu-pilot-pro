# SECURITY BLOCKER: the current public plaintext HTTP origin is rejected by
# scripts/prod_deploy.py. Client-facing TLS and X-Forwarded-Proto do not encrypt
# the US-to-China origin hop. Before production, use verified HTTPS with
# `proxy_ssl_verify on`, a trusted CA bundle, and preferably mTLS; alternatively
# route HTTP only over an operator-verified VPN/private address.
# Managed separately from nginx-full.conf because the certificate is provisioned on the US host.
# HTTPS is received by HAProxy on public port 443 and forwarded to this loopback listener.

server {
    listen 127.0.0.1:8443 ssl;
    server_name www.xianyupilot.com;
    root /var/www/user-web;
    index index.html;
    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/xianyupilot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xianyupilot/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /uploads/ {
        proxy_pass http://1.12.66.249:18080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /api/sse/subscribe {
        proxy_pass http://1.12.66.249:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_socket_keepalive on;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://1.12.66.249:18080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /ai/ {
        proxy_pass http://1.12.66.249:18080/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /bot/ {
        proxy_pass http://1.12.66.249:18080/bot/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

