# Nginx Brotli 压缩配置片段
#
# 启用前提：
#   1. Nginx 已编译 ngx_http_brotli_filter_module 和 ngx_http_brotli_static_module
#      （https://github.com/google/ngx_brotli）
#   2. 前端构建已生成 .br 预压缩文件（user-web/vite.config.js 与 admin-web/vite.config.ts
#      已配置 viteCompression algorithm='brotliCompress' ext='.br'）
#
# 启用方法：
#   在主 Nginx 配置文件（us-nginx-full.conf / xianyupilot-ssl.conf / user-web/nginx.conf /
#   admin-web/nginx.conf）的 http 或 server 块中添加：
#       include /etc/nginx/brotli.conf;
#
# 验证：
#   curl -sI -H 'Accept-Encoding: br' https://your-site/assets/index-xxx.js
#   响应头应包含 Content-Encoding: br
#
# 兼容性：
#   - 现代浏览器（Chrome 49+/Edge 15+/Firefox 44+/Safari 11+）支持 Brotli
#   - 不支持的浏览器会回退到 gzip（brotli 与 gzip 配置可共存，brotli 优先级更高）

# 优先返回预压缩 .br 文件（零 CPU 开销，配合 vite-plugin-compression 生成）
brotli_static on;

# 动态 Brotli 压缩兜底（未预压缩的资源如 API JSON 响应）
brotli on;
brotli_comp_level 6;
brotli_min_length 1024;
brotli_buffers 16 8k;
brotli_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;
