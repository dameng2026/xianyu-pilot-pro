# Production single-stack overlay. This is not blue/green; see scripts/prod_deploy.py.
# Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  mysql:
    restart: always
    mem_limit: "${MYSQL_MEMORY_LIMIT_BYTES:?MYSQL_MEMORY_LIMIT_BYTES must be set}"
    cpus: "${MYSQL_CPUS:?MYSQL_CPUS must be set}"
    pids_limit: "${MYSQL_PIDS_LIMIT:?MYSQL_PIDS_LIMIT must be set}"
    stop_grace_period: 2m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_USER: ${MYSQL_APP_USER:?MYSQL_APP_USER must be set}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be set}
    # MySQL 8.4 性能调优（16G 服务器专属配置）：
    #   - innodb-buffer-pool-size=8G：核心热数据（订单/商品/生图记录）全量驻留内存，避免磁盘 I/O
    #     原默认 512M 严重不足，百万级订单表扫描退化为磁盘 I/O，是慢查询根因
    #   - innodb-log-file-size=1G：Redo Log 从 256M 提到 1G，减少 checkpoint 抖动
    #   - innodb-buffer-pool-instances=8：配合 8G 池拆分为 8 个实例，减少锁竞争（原 4 个对应 512M 偏小）
    #   - innodb-flush-log-at-trx-commit=2：每次事务提交仅写 OS Page Cache，不强制 fsync
    #     业务可接受极端断电丢失最近 1s 事务，换取写入吞吐 3-5 倍提升
    #   - innodb-flush-method=O_DIRECT：绕过 OS Page Cache，避免 Double Buffering
    #   - tmp-table-size/max-heap-table-size=128M：临时表内存上限（原 64M 偏小，复杂 GROUP BY 会落盘）
    #   - sort-buffer-size=4M：每个排序线程缓冲区（保持原值，过大反而浪费内存）
    #   - join-buffer-size=4M：每个 join 线程缓冲区（新增，默认 256K 偏小）
    #   - max-connections=500：连接数上限（原 300，配合 HikariCP 最大 50 + Python + crawler + 监控）
    #   - slow-query-log=ON：开启慢查询日志，定位性能瓶颈的前置条件
    #   - long-query-time=1：超过 1 秒的查询记入慢查询日志（生产建议 0.5~1s）
    #   - log-queries-not-using-indexes=ON：未走索引的查询也记入日志（即使 <1s）
    #     用于发现漏建索引的 SQL，配合 V1.64 复合索引修复后应基本无命中
    #   慢查询日志输出到容器 /var/lib/mysql/ 下，通过 docker logs 或挂载卷查看
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00 --sort-buffer-size=4194304 --tmp-table-size=134217728 --max-heap-table-size=134217728 --join-buffer-size=4194304 --binlog-expire-logs-seconds=172800 --max-binlog-size=256M --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-8G} --innodb-log-file-size=${MYSQL_INNODB_LOG_FILE_SIZE:-1G} --max-connections=${MYSQL_MAX_CONNECTIONS:-500} --innodb-flush-method=O_DIRECT --innodb-buffer-pool-instances=8 --innodb-flush-log-at-trx-commit=2 --innodb-buffer-pool-dump-at-shutdown=ON --innodb-buffer-pool-load-at-startup=ON --slow-query-log=ON --long-query-time=1 --log-queries-not-using-indexes=ON
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    restart: always
    mem_limit: "${REDIS_MEMORY_LIMIT_BYTES:?REDIS_MEMORY_LIMIT_BYTES must be set}"
    cpus: "${REDIS_CPUS:?REDIS_CPUS must be set}"
    pids_limit: "${REDIS_PIDS_LIMIT:?REDIS_PIDS_LIMIT must be set}"
    stop_grace_period: 1m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    # Redis 性能调优：
    #   - appendonly no：关闭 AOF 持久化。Redis 仅承担缓存层职责（鱼小铺数据缓存、
    #     Token 缓存、维护横幅状态、限流计数），数据全部可从 MySQL 重建。
    #     原 appendonly yes 每次写入都 fsync，对写入延迟有 5-10ms 影响
    #   - save 300 10：RDB 快照，5 分钟内至少 10 个 key 变化才触发，几乎无开销
    #     作为冷启动兜底，避免重启后缓存完全冷启动
    #   - maxmemory 1gb：从 512M 提到 1G，容纳更多鱼小铺数据缓存（CACHE_TTL=300s）
    #   - maxmemory-policy allkeys-lru：所有 key 参与 LRU 淘汰
    #     原 volatile-lru 仅淘汰带 TTL 的 key，无 TTL key 会堆积占用内存
    command: ["redis-server", "--appendonly", "no", "--save", "300 10", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "--maxmemory", "${REDIS_MAXMEMORY:-1gb}", "--maxmemory-policy", "allkeys-lru"]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  crawler-postgres:
    restart: always
    mem_limit: "${POSTGRES_MEMORY_LIMIT_BYTES:?POSTGRES_MEMORY_LIMIT_BYTES must be set}"
    cpus: "${POSTGRES_CPUS:?POSTGRES_CPUS must be set}"
    pids_limit: "${POSTGRES_PIDS_LIMIT:?POSTGRES_PIDS_LIMIT must be set}"
    stop_grace_period: 2m
    environment:
      POSTGRES_DB: ${CRAWLER_DB:?CRAWLER_DB must be set}
      POSTGRES_USER: ${CRAWLER_DB_USER:?CRAWLER_DB_USER must be set}
      POSTGRES_PASSWORD: ${CRAWLER_DB_PASSWORD:?CRAWLER_DB_PASSWORD must be set}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  backend:
    restart: always
    mem_limit: "${CORE_API_MEMORY_LIMIT_BYTES:?CORE_API_MEMORY_LIMIT_BYTES must be set}"
    cpus: "${CORE_API_CPUS:?CORE_API_CPUS must be set}"
    pids_limit: "${CORE_API_PIDS_LIMIT:?CORE_API_PIDS_LIMIT must be set}"
    stop_grace_period: 1m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_USERNAME: ${MYSQL_APP_USER:?MYSQL_APP_USER must be set}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET must be set}
      COOKIE_CRYPTO_SECRET: ${COOKIE_CRYPTO_SECRET:?COOKIE_CRYPTO_SECRET must be set}
      API_KEY_CRYPTO_SECRET: ${API_KEY_CRYPTO_SECRET:?API_KEY_CRYPTO_SECRET must be set}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set}
      OPS_METRICS_TOKEN: ${OPS_METRICS_TOKEN:?OPS_METRICS_TOKEN must be set}
      IMAGE_PROXY_ALLOWED_HOSTS: ${IMAGE_PROXY_ALLOWED_HOSTS:?IMAGE_PROXY_ALLOWED_HOSTS must be set}
      AI_PROVIDER_ALLOWED_HOSTS: ${AI_PROVIDER_ALLOWED_HOSTS:?AI_PROVIDER_ALLOWED_HOSTS must be set}
      ADMIN_CORS_ALLOWED_ORIGINS: ${ADMIN_CORS_ALLOWED_ORIGINS:?ADMIN_CORS_ALLOWED_ORIGINS must be set}
      USER_CORS_ALLOWED_ORIGINS: ${USER_CORS_ALLOWED_ORIGINS:?USER_CORS_ALLOWED_ORIGINS must be set}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER must be set}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE must be set}
      ADMIN_SEED_ENABLED: "false"
      PAYMENT_SANDBOX_ENABLED: "false"
      PAYMENT_EXTERNAL_BASE_URL: ${PAYMENT_EXTERNAL_BASE_URL:-https://www.xianyupilot.com}
      SCHEMA_RUNTIME_MUTATIONS_ENABLED: "false"
      UPLOAD_GOVERNANCE_ENABLED: "true"
      UPLOAD_RATE_LIMIT_REQUESTS: ${UPLOAD_RATE_LIMIT_REQUESTS:?UPLOAD_RATE_LIMIT_REQUESTS must be set}
      UPLOAD_RATE_LIMIT_WINDOW_SECONDS: ${UPLOAD_RATE_LIMIT_WINDOW_SECONDS:?UPLOAD_RATE_LIMIT_WINDOW_SECONDS must be set}
      UPLOAD_MAX_CONCURRENT_PER_TENANT: ${UPLOAD_MAX_CONCURRENT_PER_TENANT:?UPLOAD_MAX_CONCURRENT_PER_TENANT must be set}
      UPLOAD_MAX_CONCURRENT_GLOBAL: ${UPLOAD_MAX_CONCURRENT_GLOBAL:?UPLOAD_MAX_CONCURRENT_GLOBAL must be set}
      MEDIA_COOKIE_SECURE: "true"
      MEDIA_SESSION_MAX_AGE_SECONDS: ${MEDIA_SESSION_MAX_AGE_SECONDS:?MEDIA_SESSION_MAX_AGE_SECONDS must be set}
      OPEN_SOURCE_BRIDGE_TOKEN: ${OPEN_SOURCE_BRIDGE_TOKEN:-}
      OPEN_SOURCE_BRIDGE_SITE_CODE: ${OPEN_SOURCE_BRIDGE_SITE_CODE:-open-source}
      OPEN_SOURCE_BRIDGE_SITE_NAME: ${OPEN_SOURCE_BRIDGE_SITE_NAME:-开源版}
      JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=75 -XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:+ExitOnOutOfMemoryError"
      # 临时修复：ApiSliderSolveService 引用 AUTOMATION_SERVICE_URL（application.yml 治本改为 AUTOMATION_BASE_URL 后可移除）
      AUTOMATION_SERVICE_URL: http://automation:12401
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:18080/api/ops/readiness | grep -q '\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  automation:
    restart: always
    mem_limit: "${AUTOMATION_API_MEMORY_LIMIT_BYTES:?AUTOMATION_API_MEMORY_LIMIT_BYTES must be set}"
    cpus: "${AUTOMATION_API_CPUS:?AUTOMATION_API_CPUS must be set}"
    pids_limit: "${AUTOMATION_API_PIDS_LIMIT:?AUTOMATION_API_PIDS_LIMIT must be set}"
    stop_grace_period: 1m
    environment:
      APP_ENV: production
      MYSQL_USER: ${MYSQL_APP_USER:?MYSQL_APP_USER must be set}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be set}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set}
      COOKIE_CRYPTO_SECRET: ${COOKIE_CRYPTO_SECRET:?COOKIE_CRYPTO_SECRET must be set}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET must be set}
      ADMIN_JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER must be set}
      ADMIN_JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SCHEMA_RUNTIME_MUTATIONS_ENABLED: "false"
      UPLOAD_GOVERNANCE_ENABLED: "true"
      UPLOAD_RATE_LIMIT_REQUESTS: ${UPLOAD_RATE_LIMIT_REQUESTS:?UPLOAD_RATE_LIMIT_REQUESTS must be set}
      UPLOAD_RATE_LIMIT_WINDOW_SECONDS: ${UPLOAD_RATE_LIMIT_WINDOW_SECONDS:?UPLOAD_RATE_LIMIT_WINDOW_SECONDS must be set}
      UPLOAD_MAX_CONCURRENT_PER_TENANT: ${UPLOAD_MAX_CONCURRENT_PER_TENANT:?UPLOAD_MAX_CONCURRENT_PER_TENANT must be set}
      UPLOAD_MAX_CONCURRENT_GLOBAL: ${UPLOAD_MAX_CONCURRENT_GLOBAL:?UPLOAD_MAX_CONCURRENT_GLOBAL must be set}
      UPLOAD_RETENTION_DAYS: ${UPLOAD_RETENTION_DAYS:?UPLOAD_RETENTION_DAYS must be set}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  automation-worker:
    restart: always
    mem_limit: "${AUTOMATION_WORKER_MEMORY_LIMIT_BYTES:?AUTOMATION_WORKER_MEMORY_LIMIT_BYTES must be set}"
    cpus: "${AUTOMATION_WORKER_CPUS:?AUTOMATION_WORKER_CPUS must be set}"
    pids_limit: "${AUTOMATION_WORKER_PIDS_LIMIT:?AUTOMATION_WORKER_PIDS_LIMIT must be set}"
    stop_grace_period: 2m
    environment:
      APP_ENV: production
      MYSQL_USER: ${MYSQL_APP_USER:?MYSQL_APP_USER must be set}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be set}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set}
      COOKIE_CRYPTO_SECRET: ${COOKIE_CRYPTO_SECRET:?COOKIE_CRYPTO_SECRET must be set}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET must be set}
      ADMIN_JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER must be set}
      ADMIN_JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SCHEMA_RUNTIME_MUTATIONS_ENABLED: "false"
      UPLOAD_GOVERNANCE_ENABLED: "true"
      UPLOAD_RATE_LIMIT_REQUESTS: ${UPLOAD_RATE_LIMIT_REQUESTS:?UPLOAD_RATE_LIMIT_REQUESTS must be set}
      UPLOAD_RATE_LIMIT_WINDOW_SECONDS: ${UPLOAD_RATE_LIMIT_WINDOW_SECONDS:?UPLOAD_RATE_LIMIT_WINDOW_SECONDS must be set}
      UPLOAD_MAX_CONCURRENT_PER_TENANT: ${UPLOAD_MAX_CONCURRENT_PER_TENANT:?UPLOAD_MAX_CONCURRENT_PER_TENANT must be set}
      UPLOAD_MAX_CONCURRENT_GLOBAL: ${UPLOAD_MAX_CONCURRENT_GLOBAL:?UPLOAD_MAX_CONCURRENT_GLOBAL must be set}
      UPLOAD_RETENTION_DAYS: ${UPLOAD_RETENTION_DAYS:?UPLOAD_RETENTION_DAYS must be set}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  crawler-service:
    restart: always
    mem_limit: "${CRAWLER_API_MEMORY_LIMIT_BYTES:?CRAWLER_API_MEMORY_LIMIT_BYTES must be set}"
    cpus: "${CRAWLER_API_CPUS:?CRAWLER_API_CPUS must be set}"
    pids_limit: "${CRAWLER_API_PIDS_LIMIT:?CRAWLER_API_PIDS_LIMIT must be set}"
    stop_grace_period: 1m
    environment:
      NODE_ENV: production
      CRAWLER_DB_USER: ${CRAWLER_DB_USER:?CRAWLER_DB_USER must be set}
      CRAWLER_DB_PASSWORD: ${CRAWLER_DB_PASSWORD:?CRAWLER_DB_PASSWORD must be set}
      CRAWLER_DB: ${CRAWLER_DB:?CRAWLER_DB must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set}
      COOKIE_CRYPTO_SECRET: ${COOKIE_CRYPTO_SECRET:?COOKIE_CRYPTO_SECRET must be set}
      CORS_ALLOWED_ORIGINS: ${CRAWLER_CORS_ALLOWED_ORIGINS:?CRAWLER_CORS_ALLOWED_ORIGINS must be set}
      SCHEMA_RUNTIME_MUTATIONS_ENABLED: "false"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  crawler-worker:
    restart: always
    mem_limit: "${CRAWLER_WORKER_MEMORY_LIMIT_BYTES:?CRAWLER_WORKER_MEMORY_LIMIT_BYTES must be set}"
    cpus: "${CRAWLER_WORKER_CPUS:?CRAWLER_WORKER_CPUS must be set}"
    pids_limit: "${CRAWLER_WORKER_PIDS_LIMIT:?CRAWLER_WORKER_PIDS_LIMIT must be set}"
    stop_grace_period: 2m
    environment:
      NODE_ENV: production
      CRAWLER_DB_USER: ${CRAWLER_DB_USER:?CRAWLER_DB_USER must be set}
      CRAWLER_DB_PASSWORD: ${CRAWLER_DB_PASSWORD:?CRAWLER_DB_PASSWORD must be set}
      CRAWLER_DB: ${CRAWLER_DB:?CRAWLER_DB must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set}
      COOKIE_CRYPTO_SECRET: ${COOKIE_CRYPTO_SECRET:?COOKIE_CRYPTO_SECRET must be set}
      SCHEMA_RUNTIME_MUTATIONS_ENABLED: "false"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  user-web:
    restart: always
    mem_limit: "${USER_WEB_MEMORY_LIMIT_BYTES:?USER_WEB_MEMORY_LIMIT_BYTES must be set}"
    cpus: "${USER_WEB_CPUS:?USER_WEB_CPUS must be set}"
    pids_limit: "${USER_WEB_PIDS_LIMIT:?USER_WEB_PIDS_LIMIT must be set}"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  admin-web:
    restart: always
    mem_limit: "${ADMIN_WEB_MEMORY_LIMIT_BYTES:?ADMIN_WEB_MEMORY_LIMIT_BYTES must be set}"
    cpus: "${ADMIN_WEB_CPUS:?ADMIN_WEB_CPUS must be set}"
    pids_limit: "${ADMIN_WEB_PIDS_LIMIT:?ADMIN_WEB_PIDS_LIMIT must be set}"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
