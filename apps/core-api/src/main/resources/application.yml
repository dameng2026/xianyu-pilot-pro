server:
  port: 18080
  servlet:
    encoding:
      charset: UTF-8
      force-response: true
  # Tomcat thread pool tuning. Default threads.max=200 is too low for a backend
  # that holds long-lived SSE connections (/api/sse/subscribe, timeout 86400s):
  # each online SSE client occupies one Tomcat thread for its entire lifetime,
  # so 200 concurrent SSE users would starve all API requests.
  tomcat:
    threads:
      max: 400
      min-spare: 25
    accept-count: 100
    max-connections: 8192
    connection-timeout: 20s

spring:
  application:
    name: xianyu-assistant-admin-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  main:
    banner-mode: off
    cloud-platform: none
    allow-bean-definition-overriding: false
  jmx:
    enabled: false
  devtools:
    restart:
      trigger-file: .trigger
      exclude: static/**,public/**
    livereload:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        # Batch INSERT/UPDATE to reduce round trips for bulk operations.
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        # Batch fetch lazy associations to avoid N+1 select queries.
        default_batch_fetch_size: 25
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # rewriteBatchedStatements=true rewrites multiple INSERT VALUES into a
    # single multi-row INSERT, required for Hibernate batch_size to take effect.
    url: jdbc:mysql://localhost:3306/xianyu_assistant_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 123456
    hikari:
      minimum-idle: 2
      maximum-pool-size: 20
      # connection-timeout here is HikariCP's wait-for-connection timeout
      # (NOT Tomcat's; see server.tomcat.connection-timeout above).
      connection-timeout: 10000
      max-lifetime: 1800000
      # Reclaim idle connections before MySQL wait_timeout closes them.
      idle-timeout: 600000
      # Log a warning when a connection is held longer than 30s; helps spot
      # long transactions that hold connections while doing HTTP calls.
      leak-detection-threshold: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  sql:
    init:
      mode: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-no-trace}] %logger{36} - %msg%n"
  level:
    root: WARN
    com.xianyu: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN

ops:
  metrics:
    token: ${OPS_METRICS_TOKEN:}

client-errors:
  ingress:
    max-requests-per-window: ${CLIENT_ERROR_MAX_REQUESTS_PER_WINDOW:60}
    window-millis: ${CLIENT_ERROR_RATE_WINDOW_MILLIS:60000}
    max-body-bytes: ${CLIENT_ERROR_MAX_BODY_BYTES:65536}

image:
  proxy:
    allowed-hosts: ${IMAGE_PROXY_ALLOWED_HOSTS:}
    max-bytes: ${IMAGE_PROXY_MAX_BYTES:10485760}
    max-redirects: ${IMAGE_PROXY_MAX_REDIRECTS:3}

notification:
  webhook:
    allowed-hosts: ${NOTIFICATION_WEBHOOK_ALLOWED_HOSTS:}
  smtp:
    allowed-hosts: ${NOTIFICATION_SMTP_ALLOWED_HOSTS:}

payment:
  sandbox:
    enabled: ${PAYMENT_SANDBOX_ENABLED:false}
  external-base-url: ${PAYMENT_EXTERNAL_BASE_URL:}

# 开源版桥接配置：开源版通过 HTTP 头 X-Open-Source-Token 访问
# /admin-api/open-source-bridge/* 系列接口。token 为空时拒绝所有桥接请求（fail-closed）。
# 部署时 OPEN_SOURCE_BRIDGE_TOKEN 必须与开源版 .env 的 COMMERCIAL_BACKEND_ACCESS_TOKEN 完全一致。
open:
  source:
    bridge:
      token: ${OPEN_SOURCE_BRIDGE_TOKEN:}
      site-code: ${OPEN_SOURCE_BRIDGE_SITE_CODE:open-source}
      site-name: ${OPEN_SOURCE_BRIDGE_SITE_NAME:开源版}

# 商业版后端连接配置：开源版部署后，反馈数据会转发到商业版后端。
# 未配置时反馈降级到本地数据库存储。
commercial:
  backend:
    url: ${COMMERCIAL_BACKEND_URL:}
    access-token: ${COMMERCIAL_BACKEND_ACCESS_TOKEN:}
    site-code: ${COMMERCIAL_BACKEND_SITE_CODE:open-source}
    site-name: ${COMMERCIAL_BACKEND_SITE_NAME:开源版}
    frontend-url: ${COMMERCIAL_BACKEND_FRONTEND_URL:}
    admin-url: ${COMMERCIAL_BACKEND_ADMIN_URL:}

admin:
  seed:
    enabled: ${ADMIN_SEED_ENABLED:false}
  jwt:
    secret: ${ADMIN_JWT_SECRET:please-change-this-admin-jwt-secret-at-least-32-chars}
    expire-seconds: ${JWT_EXPIRE_SECONDS:3600}
    issuer: ${JWT_ISSUER:xianyu-core-api}
    audience: ${JWT_AUDIENCE:xianyu-user-api}
  cors:
    allowed-origins: ${ADMIN_CORS_ALLOWED_ORIGINS:http://localhost:3006,http://127.0.0.1:3006}
    allowed-origin-patterns: ${ADMIN_CORS_ALLOWED_ORIGIN_PATTERNS:}
    user-allowed-origins: ${USER_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175}
    user-allowed-origin-patterns: ${USER_CORS_ALLOWED_ORIGIN_PATTERNS:}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

xianyu:
  upload:
    root-dir: ${XIANYU_UPLOAD_ROOT_DIR:../automation-service/uploads}
  media:
    cookie-secure: ${MEDIA_COOKIE_SECURE:false}
    session-max-age-seconds: ${MEDIA_SESSION_MAX_AGE_SECONDS:1200}
  schema:
    runtime-mutations-enabled: ${SCHEMA_RUNTIME_MUTATIONS_ENABLED:true}
  security-guard:
    enabled: ${XIANYU_SECURITY_GUARD_ENABLED:false}
  cookie:
    crypto-secret: ${COOKIE_CRYPTO_SECRET:dev-only-cookie-crypto-secret-change-me-32-chars}
  automation:
    base-url: ${AUTOMATION_BASE_URL:http://localhost:12401}
    crawler-base-url: ${CRAWLER_BASE_URL:http://localhost:3001}
    internal-token: ${INTERNAL_API_TOKEN:dev-only-internal-api-token-change-me-32-chars}
  ai:
    provider:
      enabled: ${AI_PROVIDER_ENABLED:false}
      base-url: ${AI_PROVIDER_BASE_URL:}
      api-key: ${AI_PROVIDER_API_KEY:}
      model: ${AI_PROVIDER_MODEL:gpt-4o-mini}
      timeout-seconds: ${AI_PROVIDER_TIMEOUT_SECONDS:30}
      allowed-hosts: ${AI_PROVIDER_ALLOWED_HOSTS:}
  sync:
    # 数据同步接收端鉴权 token（线上接收端必须配置，本地发送端可留空）
    # 默认值与 BusinessSettingsService 中预配置的 targetToken 保持一致，便于本地联调
    # 线上生产环境应通过 DATA_SYNC_API_TOKEN 环境变量覆盖为独立值
    token: ${DATA_SYNC_API_TOKEN:HIDpsuvrKSlWfczLiFTJa0Ydhqm8gx7Q}
    # 发送端 HTTP 读取超时秒数
    read-timeout-seconds: ${DATA_SYNC_READ_TIMEOUT_SECONDS:120}
  retention:
    # 数据保留策略定时清理 cron（每日凌晨 04:00）
    # 与 UploadStorageCleanupService 03:30 错开，避免抖动
    cleanup-cron: ${DATA_RETENTION_CLEANUP_CRON:0 0 4 * * ?}
  api-key:
    crypto-secret: ${API_KEY_CRYPTO_SECRET:dev-only-api-key-crypto-secret-change-me-32-chars}
  # API 滑块求解对接：对外 X-Api-Key 鉴权的滑块求解服务
  # automation-base-url 复用 xianyu.automation.base-url 同源的 automation-service
  # internal-token 必须与 automation-service 端 INTERNAL_API_TOKEN 一致
  api-slider:
    automation-base-url: ${AUTOMATION_BASE_URL:http://localhost:12401}
    internal-token: ${INTERNAL_API_TOKEN:dev-only-internal-api-token-change-me-32-chars}
    solve-timeout-ms: 120000
    reconcile-cron: 0 */5 * * * ?
  # AI 客服自主学习知识库配置
  ai-cs:
    kb-learning:
      enabled: ${KB_LEARNING_ENABLED:true}
      cron: ${KB_LEARNING_CRON:0 0 2 * * ?}
      lookback-hours: ${KB_LEARNING_LOOKBACK_HOURS:24}
      ai-ratio-threshold: ${KB_LEARNING_AI_RATIO:0.6}
      min-conversation-messages: ${KB_LEARNING_MIN_MSGS:5}
      max-conversations-per-run: ${KB_LEARNING_MAX_CONVS:500}
      llm-batch-size: ${KB_LEARNING_LLM_BATCH:5}
      llm-concurrency: ${KB_LEARNING_LLM_CONCURRENCY:3}
      auto-approve: ${KB_LEARNING_AUTO_APPROVE:true}
      top-k-inject: ${KB_LEARNING_TOP_K:3}
      max-cost-yuan-per-run: ${KB_LEARNING_MAX_COST:50}
      automation-base-url: ${AUTOMATION_BASE_URL:http://localhost:12401}

---
spring:
  config:
    activate:
      on-profile: prod
  main:
    lazy-initialization: false
    banner-mode: console
  jmx:
    enabled: true

admin:
  seed:
    enabled: ${ADMIN_SEED_ENABLED:false}

# 生产环境强制开启安全门禁：所有弱密钥/默认值/不安全配置将导致启动失败（fail-closed）
# 部署前必须通过环境变量注入符合强度要求的 INTERNAL_API_TOKEN/ADMIN_JWT_SECRET/COOKIE_CRYPTO_SECRET 等
xianyu:
  security-guard:
    enabled: true
