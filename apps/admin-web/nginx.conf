# Upstream pool with keepalive to reuse TCP connections to backend.
upstream backend_pool {
  server backend:18080;
  keepalive 32;
  keepalive_timeout 60s;
}

# Enable gzip compression for text-based assets.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_types
  application/javascript
  application/json
  application/wasm
  application/xml
  text/css
  text/plain
  text/xml
  image/svg+xml;

# Brotli 压缩（比 gzip 再小 10-20%）。
# 启用前提：Nginx 镜像已编译 ngx_brotli 模块（见 deploy/nginx/brotli.conf）。
# 当前默认未启用：构建带 brotli 的 Nginx 镜像后，取消下方 include 行的注释即可启用。
# 前端构建已生成 .br 预压缩文件（vite.config.ts 中 brotliCompress 实例）。
# include /etc/nginx/brotli.conf;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 20m;
  root /usr/share/nginx/html;
  index index.html;

  # Prefer pre-compressed .gz assets produced by vite-plugin-compression.
  # Falls back to on-the-fly gzip (gzip on; above) when .gz is missing.
  gzip_static on;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }

  location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    access_log off;
  }

  # Uploaded logos and avatars are served by core-api, not this immutable web
  # image.  Keep this as ^~ so the extension regex above cannot shadow it.
  location ^~ /uploads/ {
    proxy_pass http://backend_pool/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  location /admin-api/ {
    proxy_pass http://backend_pool/admin-api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}
