<!doctype html>
<html>
  <head>
    <title>闲鱼助手管理后台</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="闲鱼助手管理后台，用于账号、任务、订单、系统配置与运维管理。"
    />
    <link rel="shortcut icon" type="image/x-icon" href="src/assets/images/favicon.ico" />

    <!-- 预连接后端 API，减少首次请求的 DNS+TLS 握手时间 -->
    <link rel="preconnect" href="/api" />
    <link rel="dns-prefetch" href="/api" />

    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html {
        background-color: #fafbfc;
      }

      html.dark {
        background-color: #070707;
      }
    </style>

    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }

          const themeType = localStorage.getItem('sys-theme')
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()

      // 紧急遮罩清理：防止初始化过程中残留的 loading/mask 遮挡页面
      ;(function emergencyMaskCleanup() {
        function cleanMasks() {
          try {
            if (!document.body) return
            var badClasses = ['el-loading-mask', 'art-loading-fix', 'v-modal']
            badClasses.forEach(function (cls) {
              var nodes = document.querySelectorAll('.' + cls)
              nodes.forEach(function (n) { n.remove() })
            })
            var overlays = document.querySelectorAll('.el-overlay')
            overlays.forEach(function (o) {
              if (!o.querySelector('.el-dialog, .el-message-box, .el-drawer, .el-message, .el-notification')) {
                o.remove()
              }
            })
            document.body.classList.remove('el-loading-parent--hidden', 'el-popup-parent--hidden')
            document.body.style.overflow = ''
          } catch {}
        }
        if (document.body) cleanMasks()
        document.addEventListener('DOMContentLoaded', cleanMasks)
        window.addEventListener('load', function () {
          cleanMasks()
          setTimeout(cleanMasks, 300)
          setTimeout(cleanMasks, 1000)
          setTimeout(cleanMasks, 2000)
          setTimeout(cleanMasks, 4000)
        })
      })()
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
